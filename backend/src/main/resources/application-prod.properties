# Produção: todas as credenciais e URLs são obrigatórias e fornecidas pelo ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Sem valor padrão: a aplicação não inicia em produção sem JWT_SECRET.
edulead.jwt.secret=${JWT_SECRET}
edulead.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
edulead.seed.enabled=false

# Habilite somente após executar o baseline manual do banco persistente existente.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
