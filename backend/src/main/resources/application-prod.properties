# Produção: todas as credenciais e URLs são obrigatórias e fornecidas pelo ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Sem valor padrão: a aplicação não inicia em produção sem JWT_SECRET.
edulead.jwt.secret=${JWT_SECRET}
edulead.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
edulead.seed.enabled=false

# Habilite somente após executar o baseline manual do banco persistente existente.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

edulead.r2.enabled=${R2_ENABLED:false}
edulead.r2.endpoint=${R2_ENDPOINT:}
edulead.r2.bucket=${R2_BUCKET:}
edulead.r2.access-key-id=${R2_ACCESS_KEY_ID:}
edulead.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
edulead.r2.max-file-size-bytes=${R2_MAX_FILE_SIZE_BYTES:10485760}
edulead.r2.signed-url-minutes=${R2_SIGNED_URL_MINUTES:10}
edulead.ai.enabled=${AI_ENABLED:false}
edulead.ai.provider=${AI_PROVIDER:gemini}
edulead.ai.api-key=${GEMINI_API_KEY:}
edulead.ai.model=${AI_MODEL:gemini-3.5-flash-lite}
