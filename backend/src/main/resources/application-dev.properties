# Desenvolvimento local: não contém credenciais reais. Defina DB_PASSWORD no terminal.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edulead?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Segredo exclusivamente local. Produção nunca utiliza este valor.
edulead.jwt.secret=${JWT_SECRET:EduLeadDevelopmentOnlySecretChangeBeforeAnyDeployment2026}
edulead.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
edulead.seed.enabled=${SEED_ENABLED:true}

# O Flyway será habilitado após o baseline seguro do schema MySQL atual.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
