# Desenvolvimento local: não contém credenciais reais. Defina DB_PASSWORD no terminal.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edulead?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Segredo exclusivamente local. Produção nunca utiliza este valor.
edulead.jwt.secret=${JWT_SECRET:EduLeadDevelopmentOnlySecretChangeBeforeAnyDeployment2026}
edulead.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
edulead.seed.enabled=${SEED_ENABLED:true}

# O Flyway será habilitado após o baseline seguro do schema MySQL atual.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# Integrações externas permanecem desabilitadas até receberem credenciais locais.
edulead.r2.enabled=${R2_ENABLED:false}
edulead.r2.endpoint=${R2_ENDPOINT:}
edulead.r2.bucket=${R2_BUCKET:}
edulead.r2.access-key-id=${R2_ACCESS_KEY_ID:}
edulead.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
edulead.r2.max-file-size-bytes=${R2_MAX_FILE_SIZE_BYTES:10485760}
edulead.r2.signed-url-minutes=${R2_SIGNED_URL_MINUTES:10}
edulead.ai.enabled=${AI_ENABLED:false}
edulead.ai.provider=${AI_PROVIDER:gemini}
edulead.ai.api-key=${GEMINI_API_KEY:}
edulead.ai.model=${AI_MODEL:gemini-3.5-flash-lite}
